[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-cleanup-manifest-toolkit"
version = "0.1.0"
description = "Manifest-first file cleanup CLI for cautious rename and move workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yurii Bakurov" }]
keywords = ["macos", "file-cleanup", "manifest", "rename", "cli", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment :: File Managers",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Yurii201811/mac-cleanup-manifest-toolkit"
Repository = "https://github.com/Yurii201811/mac-cleanup-manifest-toolkit"
Issues = "https://github.com/Yurii201811/mac-cleanup-manifest-toolkit/issues"
Changelog = "https://github.com/Yurii201811/mac-cleanup-manifest-toolkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mac-cleanup = "mac_cleanup_manifest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
